<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Place Order — Sai Bhavani Stores</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Plus Jakarta Sans', sans-serif; } </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 py-10 px-4">

<div class="max-w-xl mx-auto bg-white border border-slate-200 rounded-3xl shadow-xs p-6 md:p-8">
    <div class="text-center mb-8">
        <span class="text-4xl">🛒</span>
        <h1 class="text-xl font-bold text-slate-900 mt-2">Sai Bhavani Kirana General Stores</h1>
        <p class="text-xs text-slate-400 mt-1">Submit your order details below (కిరాణా వస్తువుల ఆర్డర్ ఫారమ్)</p>
    </div>

    <form id="orderSubmissionForm" class="space-y-6" onsubmit="transmitCustomerForm(event)">
        <div class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Your Name (మీ పేరు)</label>
                <input type="text" id="custName" required placeholder="Enter complete name" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-emerald-500">
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">WhatsApp Number (వాట్సాప్ నంబర్)</label>
                <input type="tel" id="custPhone" required placeholder="e.g. 9876543210" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-emerald-500">
            </div>
        </div>

        <hr class="border-slate-100">

        <div>
            <div class="flex justify-between items-center mb-3">
                <label class="text-xs font-bold text-slate-700 uppercase">Items To Buy (కొనుగోలు వస్తువులు)</label>
                <button type="button" onclick="insertItemRow()" class="text-xs font-bold text-emerald-600 hover:text-emerald-700">+ Add Product</button>
            </div>
            <div id="itemsContainer" class="space-y-3"></div>
        </div>

        <button type="submit" id="submitFormBtn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3 rounded-xl text-xs tracking-wider uppercase transition-all shadow-md">
            Submit Order Request
        </button>
    </form>
</div>

<script>
    const TARGET_API = "https://sai-bhavani-stores.onrender.com/api";

    function insertItemRow() {
        const container = document.getElementById('itemsContainer');
        const rowId = Date.now();
        const itemHtml = `
            <div class="flex gap-2 items-center bg-slate-50 p-3 rounded-xl border border-slate-100" id="row_${rowId}">
                <input type="text" placeholder="Item Name (e.g. Sugar, Oil)" required class="flex-1 bg-white border px-3 py-1.5 text-xs rounded-lg focus:outline-emerald-500 product-name">
                <input type="number" placeholder="Qty" step="any" required class="w-16 bg-white border px-2 py-1.5 text-xs rounded-lg text-center product-qty">
                <select class="bg-white border px-2 py-1.5 text-xs rounded-lg focus:outline-emerald-500 product-unit">
                    <option value="kg">KG</option>
                    <option value="gram">Grams</option>
                    <option value="liter">Liter</option>
                    <option value="ml">ML</option>
                    <option value="packet">Packet</option>
                    <option value="piece">Piece</option>
                </select>
                <button type="button" onclick="document.getElementById('row_${rowId}').remove()" class="text-slate-400 hover:text-red-500 text-xs px-1">❌</button>
            </div>
        `;
        container.insertAdjacentHTML('beforeend', itemHtml);
    }

    async function transmitCustomerForm(e) {
        e.preventDefault();
        const submitBtn = document.getElementById('submitFormBtn');
        const rows = document.querySelectorAll('#itemsContainer > div');

        if (rows.length === 0) { alert("Please add at least one item before submitting."); return; }

        const items = [];
        rows.forEach(row => {
            items.push({
                productName: row.querySelector('.product-name').value.trim(),
                quantity: parseFloat(row.querySelector('.product-qty').value),
                unit: row.querySelector('.product-unit').value
            });
        });

        const payload = {
            customer: {
                name: document.getElementById('custName').value.trim(),
                phone: document.getElementById('custPhone').value.trim()
            },
            items: items
        };

        submitBtn.disabled = true; submitBtn.innerText = "Transmitting Order Request...";

        try {
            const res = await fetch(`${TARGET_API}/orders`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            if((await res.json()).success) {
                alert("Order successfully transmitted to shop admin grid! Your bill is compiling.");
                document.getElementById('orderSubmissionForm').reset();
                document.getElementById('itemsContainer').innerHTML = '';
                insertItemRow();
            }
        } catch(err) { alert("Connection error. Try again."); }
        finally { submitBtn.disabled = false; submitBtn.innerText = "Submit Order Request"; }
    }

    // Spawn an initial item row on startup
    window.addEventListener('DOMContentLoaded', insertItemRow);
</script>
</body>
</html>
