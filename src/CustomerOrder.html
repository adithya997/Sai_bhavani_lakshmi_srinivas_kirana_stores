<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Green Cart Grocer - Quick Order</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen font-sans antialiased">

<div class="max-w-md mx-auto bg-white min-h-screen shadow-md flex flex-col">
    <header class="bg-emerald-600 text-white text-center py-6 px-4 shadow-sm">
        <h1 class="text-2xl font-bold tracking-wide">GREEN CART GROCER</h1>
        <p class="text-xs text-emerald-100 mt-1">Scan. List Items. Pick up at Counter.</p>
    </header>

    <form id="orderForm" class="p-5 flex-1 flex flex-col space-y-6">

        <div class="space-y-3">
            <h2 class="text-sm font-semibold text-gray-500 uppercase tracking-wider">Your Details</h2>

            <div>
                <label class="block text-xs font-medium text-gray-700 mb-1">Full Name *</label>
                <input type="text" id="custName" required placeholder="e.g. Rahul Sharma"
                       class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-emerald-500 text-sm">
            </div>

            <div>
                <label class="block text-xs font-medium text-gray-700 mb-1">Mobile Number *</label>
                <input type="tel" id="custPhone" required placeholder="e.g. 9849075576"
                       class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-emerald-500 text-sm">
            </div>

            <div>
                <label class="block text-xs font-medium text-gray-700 mb-1">Your Address (Optional)</label>
                <textarea id="custAddress" rows="2" placeholder="Leave blank if picking up immediately"
                          class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-emerald-500 text-sm"></textarea>
            </div>

            <div>
                <label class="block text-xs font-medium text-gray-700 mb-1">Special Instructions (Optional)</label>
                <input type="text" id="custNotes" placeholder="e.g. Please select ripe bananas"
                       class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-emerald-500 text-sm">
            </div>
        </div>

        <hr class="border-gray-200">

        <div class="space-y-3 flex-1">
            <div class="flex justify-between items-center">
                <h2 class="text-sm font-semibold text-gray-500 uppercase tracking-wider">Items List</h2>
                <button type="button" onclick="addItemRow()"
                        class="bg-emerald-50 text-emerald-600 border border-emerald-200 px-3 py-1 rounded-md text-xs font-semibold hover:bg-emerald-100 transition">
                    + Add Item
                </button>
            </div>

            <div id="itemsContainer" class="space-y-3">
                <div class="flex items-center gap-2 item-row bg-gray-50 p-2 rounded-md border border-gray-100">
                    <input type="text" placeholder="Item Name (e.g., Rice, Tomato)" required
                           class="flex-1 min-w-0 px-2 py-1.5 border border-gray-300 rounded-md text-sm prod-name focus:ring-1 focus:ring-emerald-500">

                    <input type="number" placeholder="Qty" min="1" value="1" required
                           class="w-16 px-1.5 py-1.5 border border-gray-300 rounded-md text-sm text-center prod-qty focus:ring-1 focus:ring-emerald-500">

                    <select class="w-20 px-1 py-1.5 border border-gray-300 rounded-md text-sm bg-white prod-unit focus:ring-1 focus:ring-emerald-500">
                        <option value="kg">kg</option>
                        <option value="gram">gram</option>
                        <option value="litre">litre</option>
                        <option value="packet">packet</option>
                        <option value="piece">piece</option>
                    </select>

                    <button type="button" onclick="removeItemRow(this)" class="text-red-400 hover:text-red-600 p-1 text-sm">✕</button>
                </div>
            </div>
        </div>

        <div class="pt-4 sticky bottom-0 bg-white border-t border-gray-100 pb-4">
            <button type="submit" id="submitBtn"
                    class="w-full bg-emerald-600 text-white font-bold py-3 rounded-lg shadow-md hover:bg-emerald-700 transition active:scale-[0.99]">
                Submit Order to Shop
            </button>
        </div>
    </form>
</div>

<script>
    function addItemRow() {
        const container = document.getElementById('itemsContainer');
        const rowHtml = `
                <div class="flex items-center gap-2 item-row bg-gray-50 p-2 rounded-md border border-gray-100">
                    <input type="text" placeholder="Item Name" required class="flex-1 min-w-0 px-2 py-1.5 border border-gray-300 rounded-md text-sm prod-name">
                    <input type="number" placeholder="Qty" min="1" value="1" required class="w-16 px-1.5 py-1.5 border border-gray-300 rounded-md text-sm text-center prod-qty">
                    <select class="w-20 px-1 py-1.5 border border-gray-300 rounded-md text-sm bg-white prod-unit">
                        <option value="kg">kg</option>
                        <option value="gram">gram</option>
                        <option value="litre">litre</option>
                        <option value="packet">packet</option>
                        <option value="piece">piece</option>
                    </select>
                    <button type="button" onclick="removeItemRow(this)" class="text-red-400 hover:text-red-600 p-1 text-sm">✕</button>
                </div>
            `;
        container.insertAdjacentHTML('beforeend', rowHtml);
    }

    function removeItemRow(button) {
        const rows = document.querySelectorAll('.item-row');
        if(rows.length > 1) {
            button.closest('.item-row').remove();
        } else {
            alert("Your checkout list must have at least one grocery item!");
        }
    }

    document.getElementById('orderForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const submitBtn = document.getElementById('submitBtn');
        submitBtn.disabled = true;
        submitBtn.innerText = "Processing Order...";

        const payload = {
            customer: {
                name: document.getElementById('custName').value.trim(),
                phone: document.getElementById('custPhone').value.trim(),
                address: document.getElementById('custAddress').value.trim(), // Captures empty string gracefully if left blank
                deliveryInstructions: document.getElementById('custNotes').value.trim()
            },
            items: []
        };

        const rows = document.querySelectorAll('.item-row');
        rows.forEach(row => {
            payload.items.push({
                productName: row.querySelector('.prod-name').value.trim(),
                quantity: parseFloat(row.querySelector('.prod-qty').value) || 1,
                unit: row.querySelector('.prod-unit').value
            });
        });

        try {
            const response = await fetch('http://localhost:5000/api/orders', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const result = await response.json();

            if (result.success) {
                alert(`🎉 Order Submitted successfully to Shop Counter!\n\nPlease wait at the counter. The owner will process your bill shortly.`);
                document.getElementById('orderForm').reset();
                document.getElementById('itemsContainer').innerHTML = '';
                addItemRow();
            } else {
                alert(`Submission failed: ${result.error}`);
            }
        } catch (error) {
            console.error("Connection error:", error);
            alert('Backend engine unreachable! Check if your server node app window crashed or closed.');
        } finally {
            submitBtn.disabled = false;
            submitBtn.innerText = "Submit Order to Shop";
        }
    });
</script>
</body>
</html>
