<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Green Cart Grocer - Owner Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen font-sans p-6">

<div class="max-w-4xl mx-auto space-y-6">
    <header class="bg-slate-800 text-white p-6 rounded-xl shadow-md flex justify-between items-center">
        <div>
            <h1 class="text-3xl font-bold tracking-wide">STORE OWNER PORTAL</h1>
            <p class="text-slate-400 text-sm mt-1">Manage incoming QR orders and dispatch invoice receipts</p>
        </div>
        <button onclick="fetchPendingOrders()"
                class="bg-emerald-600 hover:bg-emerald-700 text-white font-semibold px-5 py-2.5 rounded-lg shadow transition active:scale-95">
            🔄 Refresh Orders
        </button>
    </header>

    <div id="noOrdersMessage" class="hidden bg-white rounded-xl p-8 text-center shadow border border-gray-200">
        <p class="text-gray-500 font-medium text-lg">🎉 No pending orders right now! All caught up.</p>
    </div>

    <div id="ordersContainer" class="space-y-6"></div>
</div>

<script>
    const API_BASE = 'http://localhost:5000/api';

    // 1. FETCH ALL REAL PENDING ORDERS FROM MONGODB
    async function fetchPendingOrders() {
        try {
            const response = await fetch(`${API_BASE}/admin/orders`);
            const orders = await response.json();

            const container = document.getElementById('ordersContainer');
            const noOrdersMessage = document.getElementById('noOrdersMessage');

            container.innerHTML = '';

            if (!orders || orders.length === 0) {
                noOrdersMessage.classList.remove('hidden');
                return;
            }

            noOrdersMessage.classList.add('hidden');

            // Render a dynamic card for each pending order found
            orders.forEach(order => {
                renderOrderCard(order);
            });

        } catch (err) {
            console.error("Error connecting to backend:", err);
            alert('Backend engine unreachable! Check if your server terminal is running.');
        }
    }

    // 2. RENDER THE INTERACTIVE PRICING CARD LAYOUT
    function renderOrderCard(order) {
        const container = document.getElementById('ordersContainer');

        let itemsHtml = '';
        order.items.forEach((item) => {
            itemsHtml += `
                    <div class="grid grid-cols-12 gap-4 items-center bg-gray-50 p-3 rounded-lg border border-gray-200">
                        <div class="col-span-6 font-medium text-gray-800 text-sm">
                            ${item.productName} <span class="text-gray-500 text-xs">(${item.quantity} ${item.unit})</span>
                        </div>
                        <div class="col-span-6 flex items-center gap-2">
                            <span class="text-gray-500 text-sm">₹</span>
                            <input type="number"
                                   data-product="${item.productName}"
                                   placeholder="Price per unit"
                                   class="w-full px-3 py-1.5 border border-gray-300 rounded-md text-sm price-input focus:ring-1 focus:ring-emerald-500"
                                   required>
                        </div>
                    </div>
                `;
        });

        const cardHtml = `
                <div class="bg-white rounded-xl shadow border border-gray-200 overflow-hidden" id="card-${order._id}">
                    <div class="bg-slate-700 text-white p-4 flex justify-between items-center">
                        <div>
                            <span class="bg-amber-500 text-slate-900 text-xs font-bold px-2.5 py-1 rounded-full uppercase">Pending Pricing</span>
                            <h3 class="text-sm font-mono mt-1 text-slate-300">ID: ${order._id}</h3>
                        </div>
                        <div class="text-right">
                            <p class="font-bold text-base">${order.customer.name}</p>
                            <p class="text-xs text-slate-300">${order.customer.phone}</p>
                        </div>
                    </div>

                    <div class="p-4 bg-slate-50 border-b border-gray-100 text-xs text-gray-600 space-y-1">
                        <p>📍 <strong>Address:</strong> ${order.customer.address || 'Not Provided (Store Pickup / Counter Collection)'}</p>
                        ${order.customer.deliveryInstructions ? `<p>📝 <strong>Notes:</strong> ${order.customer.deliveryInstructions}</p>` : ''}
                    </div>

                    <form onsubmit="submitFinalPricing(event, '${order._id}')" class="p-5 space-y-4">
                        <h4 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">Assign Store Pricing</h4>

                        <div class="space-y-2">
                            ${itemsHtml}
                        </div>

                        <div class="border-t border-gray-100 pt-4 flex justify-end">
                            <button type="submit"
                                    class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-6 py-3 rounded-lg shadow-md transition active:scale-98">
                                Complete Order & Send WhatsApp Invoice 📄
                            </button>
                        </div>
                    </form>
                </div>
            `;
        container.insertAdjacentHTML('beforeend', cardHtml);
    }

    // 3. SEND PRICING DATA TO BACKEND FOR PDF COMPILATION AND WHATSAPP TRANSMISSION
    async function submitFinalPricing(event, orderId) {
        event.preventDefault();

        const card = document.getElementById(`card-${orderId}`);
        const priceInputs = card.querySelectorAll('.price-input');

        const itemPrices = {};
        priceInputs.forEach(input => {
            const productName = input.getAttribute('data-product');
            const priceValue = parseFloat(input.value) || 0;
            itemPrices[productName] = priceValue;
        });

        try {
            const response = await fetch(`${API_BASE}/admin/orders/${orderId}/finalize`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ itemPrices })
            });

            const data = await response.json();

            if (data.success) {
                alert(`🎉 Success! Order finalized.\n\nInvoice PDF compiled and dispatched via WhatsApp.`);
                card.remove();

                // Show "All caught up" message if no cards are left on screen
                if (document.getElementById('ordersContainer').children.length === 0) {
                    document.getElementById('noOrdersMessage').classList.remove('hidden');
                }
            } else {
                alert(`Error finalizing: ${data.error}`);
            }
        } catch (err) {
            alert('Backend engine unreachable! Check if your server window is closed.');
        }
    }

    // Initialize dashboard list when viewport loads
    window.onload = fetchPendingOrders;
</script>
</body>
</html>
