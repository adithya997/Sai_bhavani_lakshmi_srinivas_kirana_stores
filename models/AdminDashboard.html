<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Owner Dashboard — Sai Bhavani Kirana Stores</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen antialiased text-slate-800">

<nav class="bg-white border-b border-slate-200 sticky top-0 z-50 shadow-sm backdrop-blur-md bg-white/90">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between h-16 items-center">
            <div class="flex items-center space-x-3">
                <span class="text-2xl">🏪</span>
                <div>
                    <h1 class="text-base font-bold text-slate-900 tracking-tight">Sai Bhavani Kirana Genral Stores (Battani shop)</h1>
                    <p class="text-[10px] text-slate-400 font-bold uppercase tracking-wider">Owner Console Hub (యజమాని డాష్‌బోర్డ్)</p>
                </div>
            </div>
            <button onclick="fetchAllLiveOrders()"
                    class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-xl text-xs font-semibold shadow-xs transition-all flex items-center gap-1.5 active:scale-95">
                🔄 Refresh Grid (రిఫ్రెష్)
            </button>
        </div>
    </div>
</nav>

<main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">

    <div class="mb-8 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
        <div>
            <h2 class="text-lg font-bold text-slate-900 tracking-tight">Live Active Pipeline</h2>
            <p class="text-xs text-slate-500 mt-0.5">Pending items sit up top grouped chronologically. "Done" entries filter below and drop after 24 hrs.</p>
        </div>
        <div class="flex gap-3">
                <span id="pendingTally" class="bg-amber-50 text-amber-800 border border-amber-200 px-3 py-1.5 rounded-xl text-xs font-bold flex items-center gap-1">
                    <span class="w-2 h-2 rounded-full bg-amber-500 animate-pulse"></span> 0 Pending Pricing
                </span>
            <span id="completedTally" class="bg-emerald-50 text-emerald-800 border border-emerald-200 px-3 py-1.5 rounded-xl text-xs font-bold flex items-center gap-1">
                    0 Processed Handled
                </span>
        </div>
    </div>

    <div id="ordersMasterGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <div class="col-span-full py-12 text-center text-slate-400 text-sm font-medium bg-white border border-dashed rounded-3xl shadow-sm">
            Connecting to system storage modules...
        </div>
    </div>
</main>

<script>
    const CORE_API = "https://sai-bhavani-backend.onrender.com/api";
    async function fetchAllLiveOrders() {
        const grid = document.getElementById('ordersMasterGrid');
        try {
            const response = await fetch(`${CORE_API}/admin/orders`);
            const orders = await response.json();

            // Track state counts
            const pendingCount = orders.filter(o => o.status === 'Pending').length;
            const doneCount = orders.filter(o => o.status === 'Done').length;
            document.getElementById('pendingTally').innerHTML = `<span class="w-2 h-2 rounded-full bg-amber-500 animate-pulse"></span> ${pendingCount} Pending Pricing`;
            document.getElementById('completedTally').innerText = `${doneCount} Processed Handled`;

            if(!orders || orders.length === 0) {
                grid.innerHTML = `<div class="col-span-full py-16 text-center bg-white rounded-3xl border border-slate-200 border-dashed text-slate-400 text-sm font-medium">Pipeline is completely clear. No incoming customer records found.</div>`;
                return;
            }

            grid.innerHTML = ''; // Reset layout matrix

            orders.forEach(order => {
                const isDone = order.status === 'Done';
                let itemsHtml = '';

                order.items.forEach(item => {
                    let innerHelperLabel = '';
                    if(item.unit === 'gram' || item.unit === 'gms') innerHelperLabel = ' <span class="text-emerald-600 font-bold text-[9px]">(Enter KG Rate)</span>';
                    if(item.unit === 'ml' || item.unit === 'mls') innerHelperLabel = ' <span class="text-teal-600 font-bold text-[9px]">(Enter Liter Rate)</span>';

                    itemsHtml += `
                            <div class="p-3 bg-slate-50 rounded-xl border border-slate-100 flex flex-col gap-1.5">
                                <div class="flex justify-between items-start">
                                    <div class="text-xs font-semibold text-slate-800 break-words max-w-[70%]">
                                        📦 ${item.productName}
                                        <span class="bg-white px-1.5 py-0.5 rounded border font-bold text-[10px] text-slate-500 ml-1">${item.quantity} ${item.unit}</span>
                                        ${innerHelperLabel}
                                    </div>
                                    <div class="w-24 relative flex items-center">
                                        <span class="absolute left-2.5 text-slate-400 text-xs font-medium">Rs.</span>
                                        <input type="number" step="any" placeholder="0.00"
                                               data-order-id="${order._id}"
                                               data-item-name="${item.productName}"
                                               data-qty="${item.quantity}"
                                               data-unit="${item.unit.toLowerCase().trim()}"
                                               value="${isDone ? item.price : ''}"
                                               ${isDone ? 'disabled' : `oninput="calculateLiveCardTotal('${order._id}')"`}
                                               class="w-full pl-8 pr-2 py-1 bg-white border border-slate-200 rounded-lg text-xs font-bold text-right text-slate-800 focus:outline-none focus:ring-1 focus:ring-emerald-500 disabled:bg-slate-100 disabled:text-slate-500">
                                    </div>
                                </div>
                                ${item.itemComment ? `
                                    <div class="text-[10px] bg-sky-50 text-sky-800 font-medium px-2 py-1 rounded-md border border-sky-100 flex items-center gap-1">
                                        <span>💬 Brand/Type Option:</span> <span class="font-bold italic">${item.itemComment}</span>
                                    </div>
                                ` : ''}
                            </div>
                        `;
                });

                const cardHtml = `
                        <div class="bg-white rounded-3xl border ${isDone ? 'border-slate-200/60 opacity-90 shadow-none' : 'border-slate-200 shadow-xs'} flex flex-col overflow-hidden relative" id="card_${order._id}">

                            <div class="p-5 border-b border-slate-100 bg-slate-50/50 relative">
                                <button onclick="deleteOrderRecord('${order._id}')"
                                        class="absolute top-4 right-4 text-slate-300 hover:text-red-500 p-1.5 hover:bg-red-50 rounded-lg transition-all"
                                        title="Delete Order Permanently">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-4v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
                                </button>

                                <div class="mb-2">
                                    <h3 class="text-sm font-bold text-slate-900 truncate max-w-[80%]">${order.customer.name}</h3>
                                    <p class="text-xs font-medium text-slate-500 mt-0.5">📞 ${order.customer.phone}</p>
                                </div>

                                <div class="flex items-center gap-2 mt-3">
                                    <span class="px-2 py-0.5 rounded-md text-[9px] font-bold tracking-wide uppercase ${isDone ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'}">
                                        ${isDone ? 'Invoice Dispatched (ఇన్వాయిస్ పంపబడింది)' : 'Awaiting Pricing (ధర నమోదు చేయాలి)'}
                                    </span>
                                </div>
                            </div>

                            <div class="p-5 flex-1 space-y-3 overflow-y-auto max-h-[250px]">
                                ${itemsHtml}
                            </div>

                            <div class="p-5 border-t border-slate-100 bg-slate-50/40 space-y-3">
                                <div class="flex justify-between items-center bg-white p-3 rounded-xl border border-slate-100">
                                    <div class="text-xs font-bold text-slate-600">Total Bill (మొత్తం బిల్లు):</div>
                                    <div class="text-sm font-black text-slate-900" id="totalLabel_${order._id}">
                                        Rs. ${order.totalAmount ? order.totalAmount.toFixed(2) : '0.00'}
                                    </div>
                                </div>

                                ${isDone ? `
                                    <div class="flex items-center justify-between gap-2 p-1 bg-slate-100 rounded-xl border">
                                        <button onclick="updatePaymentState('${order._id}', 'Unpaid')"
                                                class="flex-1 py-1.5 text-[11px] font-bold rounded-lg transition-all ${order.paymentStatus === 'Unpaid' ? 'bg-red-500 text-white shadow-xs' : 'text-slate-500 hover:text-slate-800'}">
                                            🔴 Unpaid (బాకీ)
                                        </button>
                                        <button onclick="updatePaymentState('${order._id}', 'Paid')"
                                                class="flex-1 py-1.5 text-[11px] font-bold rounded-lg transition-all ${order.paymentStatus === 'Paid' ? 'bg-emerald-600 text-white shadow-xs' : 'text-slate-500 hover:text-slate-800'}">
                                            🟢 Paid (చెల్లించారు)
                                        </button>
                                    </div>
                                ` : `
                                    <button onclick="commitOrderPricing('${order._id}')" id="btn_${order._id}"
                                            class="w-full bg-slate-900 hover:bg-slate-800 text-white font-semibold py-2.5 rounded-xl text-xs tracking-wide transition-all active:scale-95">
                                        Compile & Send via WhatsApp
                                    </button>
                                `}
                            </div>
                        </div>
                    `;
                grid.insertAdjacentHTML('beforeend', cardHtml);
            });

        } catch(e) {
            grid.innerHTML = `<div class="col-span-full p-4 bg-red-50 text-red-600 text-xs font-bold text-center rounded-xl border border-red-200">API Gateway Offline. Verify server execution sequence window.</div>`;
        }
    }

    function calculateLiveCardTotal(orderId) {
        const inputs = document.querySelectorAll(`input[data-order-id="${orderId}"]`);
        let accumulatedTotal = 0;

        inputs.forEach(input => {
            const enteredRate = parseFloat(input.value) || 0;
            const quantity = parseFloat(input.getAttribute('data-qty')) || 0;
            const unit = input.getAttribute('data-unit');

            if (unit === 'gram' || unit === 'gms') {
                accumulatedTotal += (quantity / 1000) * enteredRate;
            } else if (unit === 'ml' || unit === 'mls' || unit === 'milliliter') {
                accumulatedTotal += (quantity / 1000) * enteredRate;
            } else {
                accumulatedTotal += quantity * enteredRate;
            }
        });

        document.getElementById(`totalLabel_${orderId}`).innerText = `Rs. ${accumulatedTotal.toFixed(2)}`;
    }

    async function commitOrderPricing(orderId) {
        const card = document.getElementById(`card_${orderId}`);
        const actionBtn = document.getElementById(`btn_${orderId}`);
        const inputs = card.querySelectorAll('input[data-item-name]');

        const itemPrices = {};
        let isValidationIncomplete = false;

        inputs.forEach(input => {
            const currentVal = input.value.trim();
            if(!currentVal) {
                isValidationIncomplete = true;
                input.classList.add('border-red-400', 'bg-red-50/40');
            } else {
                input.classList.remove('border-red-400', 'bg-red-50/40');
                itemPrices[input.getAttribute('data-item-name')] = parseFloat(currentVal);
            }
        });

        if(isValidationIncomplete) {
            alert("Missing pricing variable entries detected!");
            return;
        }

        actionBtn.disabled = true;
        actionBtn.innerText = "Transmitting Media Buffers...";

        try {
            const response = await fetch(`${CORE_API}/admin/orders/${orderId}/finalize`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ itemPrices })
            });
            const result = await response.json();
            if(result.success) {
                alert("Success! Invoice PDF dispatched safely via background automation.");
                fetchAllLiveOrders();
            } else {
                alert(`Compilation issue: ${result.message}`);
                actionBtn.disabled = false;
                actionBtn.innerText = "Compile & Send via WhatsApp";
            }
        } catch(e) {
            alert("Network operational communication error.");
            actionBtn.disabled = false;
            actionBtn.innerText = "Compile & Send via WhatsApp";
        }
    }

    async function updatePaymentState(orderId, nextState) {
        try {
            const response = await fetch(`${CORE_API}/admin/orders/${orderId}/payment`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ paymentStatus: nextState })
            });
            const resData = await response.json();
            if(resData.success) {
                fetchAllLiveOrders();
            }
        } catch(e) { alert("Failed to alter payment metrics."); }
    }

    async function deleteOrderRecord(orderId) {
        if(!confirm("Are you sure you want to permanently drop this checkout form entry? (ఈ ఆర్డర్‌ను తొలగించాలా?)")) return;
        try {
            const response = await fetch(`${CORE_API}/admin/orders/${orderId}`, { method: 'DELETE' });
            const resData = await response.json();
            if(resData.success) {
                fetchAllLiveOrders();
            }
        } catch(e) { alert("Deletion endpoint connection failure."); }
    }

    window.addEventListener('DOMContentLoaded', fetchAllLiveOrders);
</script>
</body>
</html>
